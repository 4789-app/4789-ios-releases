name: Installation help
description: Report a problem installing or refreshing the public iPhone beta
title: "[Install] "
labels: [installation]
body:
  - type: input
    id: build
    attributes:
      label: 4789 version and build
    validations:
      required: true
  - type: dropdown
    id: sideloader
    attributes:
      label: Sideloading method
      options: [SideStore, AltStore Classic, Sideloadly, Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone and iOS version
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Exact message and failed step
      description: Redact the Apple Account and every credential or private URL.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed account identifiers, credentials, private URLs, and settings exports.
          required: true
