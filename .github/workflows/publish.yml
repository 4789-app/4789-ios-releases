name: publish

# Releases are created by this workflow so the release author is the repository's
# CI identity. Assets are staged in release-staging/ by a docs commit. This
# workflow verifies them, REMOVES the staging directory in a bot commit, and only
# then creates the tag/release on that clean commit — so GitHub's automatic
# "Source code" archives for the tag contain documentation only, never a
# duplicate of the release binary. The SHA-256 in SHA256SUMS.txt lets anyone
# verify the download independently.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0-beta.1)"
        required: true
      title:
        description: "Release title"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify staged assets against SHA256SUMS
        run: |
          set -euo pipefail
          cd release-staging
          test -f NOTES.md
          sha256sum -c SHA256SUMS.txt

      - name: Move assets out of the tree
        run: |
          set -euo pipefail
          mv release-staging "$RUNNER_TEMP/release-assets"

      - name: Remove staging in a bot commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet --ignore-unmatch release-staging
          git commit -m "chore: remove release staging for ${{ inputs.tag }}"
          git push origin HEAD

      - name: Create the release on the clean commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-assets"
          assets=$(ls *.ipa)
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --title "${{ inputs.title }}" \
            --notes-file NOTES.md \
            --latest \
            $assets SHA256SUMS.txt
